# amigafs — fixture and oracle lock file (M0)
#
# Ground truth, measured 2026-10-13 against the pinned oracles. Every sha256 below
# was computed locally from the bytes we actually fetched; every DOS type was read
# from the bootblock (raw 4 bytes) and cross-checked against amitools.
#
# These images are downloaded at test time and NEVER committed (they are gitignored).
# ADFlib ships no separate licence for tests/data; see LICENSE.

# ---------------------------------------------------------------- oracles -----

[oracle.adflib]
name        = ADFlib
url         = https://github.com/adflib/ADFlib
commit      = 73880de78bf472a1cc7d60f07fc217e02d571268   # tag v0.10.7
library_lic = LGPL-2.1
cli_lic     = GPL-2.0-or-later
# ADFlib's adfVolIsFsValid() is a LABEL/OVERWRITE guard only, not a mount rule:
# its two callers are src/adf_dev.c:529 (prints "???" when false) and
# examples/adfformat.c:134 (guard before overwrite). ADFlib still READS DOS\2.
# Consequence: ignore ADFlib's filesystem-type *string* for DOS\2/DOS\4; compare
# listings and content only.

[oracle.amitools]
name    = amitools
url     = https://github.com/cnvogelg/amitools
version = 0.8.1
lic     = GPL-3.0
# Models DOS\0-DOS\7 with clean names ("DOS2:ofs+intl"). Preferred oracle wherever
# ADFlib labels a type "???" (i.e. DOS\2, DOS\4) and for all RDB work (rdbtool).
# Limitation: xdftool list chokes on a standalone DIRC floppy's dir-cache blocks;
# use ADFlib adfls for those.

# ------------------------------------------------------------- source url -----

[source.adflib-dumps]
url = https://github.com/adflib/ADFlib/raw/73880de78bf472a1cc7d60f07fc217e02d571268/tests/data/Dumps

